# WSL2 疊加：讓 simulator-harmonic 的 gz sim（ogre2/EGL）走 Mesa d3d12 → RTX 5070
# 用法：docker compose -f docker-compose.harmonic.yaml -f docker-compose.harmonic.wsl-gpu.yaml up -d
# 做法同 docker-compose.wsl-gpu.yaml（WSL 沒有 /dev/dri，GPU 是 /dev/dxg，
# user-mode driver 在 /usr/lib/wsl/lib）。只放 fork，不進上游 PR。
services:
  simulator-harmonic:
    environment:
      - __GLX_VENDOR_LIBRARY_NAME=mesa
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
