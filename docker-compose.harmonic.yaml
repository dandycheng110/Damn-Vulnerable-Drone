# Harmonic migration (work in progress).
# P1: simulator runtime; P2: world, models, ArduPilot plugin; P3: SITL over JSON.
# 用法：docker compose -f docker-compose.harmonic.yaml up -d --build
#
# P3 起 simulator-harmonic 佔用 Classic simulator 的位置（simulator 網段
# 10.13.0.5，flight-controller 的 SITL 連 10.13.0.5:9002，DDS peer 也是這個 IP），
# 所以 Classic 的 simulator 容器要先停，兩者不能同時開。其他 Classic 容器
# （flight-controller、companion-computer、ground-control-station）照常用
# docker-compose.yaml 起，網段是同一個（external: simulator）。
name: dvd-harmonic
services:
  simulator-harmonic:
    image: dvd-simulator-harmonic:dev
    container_name: simulator-harmonic
    build:
      context: .
      dockerfile: ./simulator/harmonic/Dockerfile
    environment:
      - DISPLAY=:100
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
    networks:
      simulator:
        ipv4_address: 10.13.0.5

networks:
  simulator:
    external: true
