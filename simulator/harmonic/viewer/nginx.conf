# Port 8080: the Harmonic 3D viewer (static) + the gz-launch websocket server
# proxied on the same origin at /ws, so remote viewing needs only the 8080
# port forward (as with Classic gzweb).
server {
    listen 8080 default_server;
    root /Simulator/viewer;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # gzweb first fetches meshes/textures over HTTP at the absolute path the
    # server reports (e.g. /Simulator/models/hacker_van/meshes/van.dae) and
    # only then falls back to the websocket, whose JPEG path is broken (see
    # src/gzwebFixups.js). Serve the two model trees read-only.
    #
    # Textures referenced from a .dae come out as ".../meshes/van.dae../materials/..."
    # (gzweb joins the mesh URL and "../" without a slash); map those back to
    # ".../materials/...".
    rewrite ^(/(?:Simulator|opt/ardupilot_gazebo)/models/.+)/[^/]+/[^/]+\.dae\.\./(.+)$ $1/$2 last;

    location /Simulator/models/ {
        alias /Simulator/models/;
    }
    location /opt/ardupilot_gazebo/models/ {
        alias /opt/ardupilot_gazebo/models/;
    }

    # The companion computer's MJPEG camera feed (what its video pipeline
    # delivers, attacks included), for the viewer's picture-in-picture.
    location = /camera/feed {
        proxy_pass http://10.13.0.3:3000/camera/video_feed;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 3s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Mesh/texture assets arrive as single large frames.
        proxy_buffering off;
    }
}
